name: orbit_workforce
description: "A modern Flutter HR management application."
publish_to: "none"

version: 1.0.0+2

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.5"

dependencies:
  flutter:
    sdk: flutter

  # Material Design icons
  cupertino_icons: ^1.0.8

  # UI and Styling
  hexcolor: ^3.0.1
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^1.2.1
  stylish_bottom_bar: ^1.1.1
  dashed_circular_progress_bar: ^0.0.6
  auto_size_text: ^3.0.0
  flutter_svg: ^2.2.0

  # State Management and Navigation
  get: ^4.7.2

  # Location Services
  geolocator: ^14.0.2
  google_maps_flutter: ^2.8.0
  permission_handler: ^11.3.1

  # Networking
  http: ^1.4.0
  odoo_rpc: ^0.7.1

  # Storage
  get_storage: ^2.1.1
  path_provider: ^2.1.4

  # Internationalization
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_spinkit: ^5.2.1
  image_picker: ^1.1.2

  path: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
